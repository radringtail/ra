<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rad's RA List</title> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Short+Stack&display=swap" rel="stylesheet">
    <link rel="stylesheet" hre="https://cdn.datatables.net/2.2.1/css/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.0/css/all.css" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
    <a href="#content" class="sr-only sr-only-focusable">Skip to Main Content</a>
    
    <header class="site-header image">
        <div class="container">
            <div class="header-title-block bg-info">
                <span class="header-title">
                    <a href="https://twitch.tv/radringtail">Rad's RA List</a>
                </span>
            </div>
            <div class="clearfix"></div>
            <div class="header-subtitle-block">
                <span class="header-subtitle">
                    <a href="https://retroachievements.org/user/radringtail">RetroAchievements</a>
                </span>
            </div>
        </div>
    </header>
    
    <div id="app-1" style="background-color: #3e65a1;">
        <div class="bg-info mb-5 shadow">
            <div class="container py-4">
                <div class="row">
                    <div class="col-lg-8 col-xl-6 mx-auto">
                        <input type="text" class="form-control form-control-lg" v-model="search" placeholder="Search 'Want to Play' List" spellcheck="false" id="search">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="container site-content">
            <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xxl-6 g-4">
                <div class="col text-center" v-for="game in filteredItems">
                    <div class="card shadow h-100 border-0">
                        <div class="card-body">
                            <p>
                                <a :href="`https://retroachievements.org/game/${game.ID}`" target="_blank"><img :src="`https://media.retroachievements.org/${game.ImageIcon}`" class="rounded-4" loading="lazy"></a>
                            </p>
                            <p>
                                <a :href="`https://retroachievements.org/game/${game.ID}`" target="_blank">
                                    <span v-html="game.Title" class="fs-5 lh-1"></span>
                                </a>
                            </p>
                        </div>
                        <div class="card-footer bg-danger bg-opacity-25" style="font-size: 0.8em;">
                            {{game.ConsoleName}}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- footers -->
    <footer class="site-footer bg-info py-3 text-white">
        <div class="container">
            Site by RadRingtail
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/2.2.1/js/dataTables.min.js"></script>
    <script src="assets/api-data.js"></script>
    <script>
        var app1 = new Vue({
            el: '#app-1',
            data: {
                search: '',
                games: gameData
            },
            computed: {
                filteredItems: function() {
                    return this.games
                    .filter(item => { return item.Title.toLowerCase().indexOf(this.search.toLowerCase()) > -1 })
                    .sort((a, b) => (a.Title > b.Title) ? 1 : -1)
                }
            }
        })
    </script>
</body>
</html>
